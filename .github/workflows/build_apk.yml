name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'

      - name: Show environment info
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          flutter --version
          java -version

      - name: Create local.properties for Android
        run: |
          mkdir -p justalo_app/android
          printf "flutter.sdk=%s\nsdk.dir=%s\n" "$FLUTTER_ROOT" "$ANDROID_HOME" > justalo_app/android/local.properties
          cat justalo_app/android/local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Get Flutter dependencies
        run: |
          cd justalo_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd justalo_app
          flutter build apk --release --verbose 2>&1 | tee /tmp/flutter_build.log
          echo "Exit code: $?"

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== FLUTTER BUILD LOG ==="
          cat /tmp/flutter_build.log | grep -E "error|Error|FAILED|Exception" | head -80

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JustAlo-App-Release.apk
          path: justalo_app/build/app/outputs/flutter-apk/app-release.apk
