name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true

      - name: Create Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > justalo_app/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> justalo_app/android/local.properties
          cat justalo_app/android/local.properties

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor

      - name: Get Flutter dependencies
        run: |
          cd justalo_app
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd justalo_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustAlo-App-Release.apk
          path: justalo_app/build/app/outputs/flutter-apk/app-release.apk
